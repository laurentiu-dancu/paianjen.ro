name: paianjen-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paianjen
      POSTGRES_PASSWORD: paianjen_dev_secret
      POSTGRES_DB: paianjen_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paianjen"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: ecto://paianjen:paianjen_dev_secret@db:5432/paianjen_dev
      SECRET_KEY_BASE: dev_secret_key_base_that_is_at_least_64_bytes_long_for_phoenix_zzz
      PHX_HOST: localhost
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      # Mount source code — changes on host are reflected instantly
      - ./lib:/app/lib:delegated
      - ./priv:/app/priv:delegated
      - ./config:/app/config:delegated
      - ./assets:/app/assets:delegated
      - ./data:/app/data:delegated
      - ./test:/app/test:delegated
      # Named volumes for build artifacts so they persist across restarts
      - mix_build:/app/_build
      - mix_deps:/app/deps
      - node_modules:/app/assets/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
  mix_build:
  mix_deps:
  node_modules:
